
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Tactical Banana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
      }

      /* Animation for mission status badges */
      @keyframes pulse-green {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(74, 222, 128, 0);
        }
      }
      .animate-pulse-green {
        animation: pulse-green 2.5s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .animate-shimmer::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 20%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0) 80%);
        animation: shimmer 2.5s infinite;
      }

      /* Animations for enemy icons */
      @keyframes twitch {
        0%, 100% { transform: rotate(0deg); }
        48% { transform: rotate(0deg); }
        50% { transform: rotate(5deg); }
        52% { transform: rotate(-5deg); }
        54% { transform: rotate(0deg); }
      }
      .animate-twitch {
        animation: twitch 3s infinite ease-in-out;
      }

      @keyframes purr {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .animate-purr {
        animation: purr 2s infinite ease-in-out;
      }

      @keyframes blink {
        0%, 48%, 100% {
          fill: currentColor;
        }
        50% {
          fill: #fef08a; /* A bright yellow */
        }
      }
      .animate-blink .led {
         animation: blink 2.5s infinite;
      }
      
      /* Animation for map pins */
      @keyframes glow-yellow {
        0%, 100% {
          box-shadow: 0 0 6px 2px rgba(250, 204, 21, 0.4);
        }
        50% {
          box-shadow: 0 0 12px 5px rgba(250, 204, 21, 0.6);
        }
      }
      .animate-glow-yellow {
        animation: glow-yellow 3s infinite ease-in-out;
      }
    </style>
